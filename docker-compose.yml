services:
  php:
    build:
      context: .
      dockerfile: docker/Dockerfile.php
    volumes:
      - ./backend:/app
    working_dir: /app
    command: php -S 0.0.0.0:8000 -t public
    ports:
      - "8000:8000"
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"

  websocket:
    build:
      context: .
      dockerfile: docker/Dockerfile.php
    volumes:
      - ./backend:/app
    working_dir: /app
    command: php bin/console app:websocket --host=0.0.0.0 --port=8081
    ports:
      - "8081:8081"
    environment:
      APP_ENV: dev
    depends_on:
      - php

  frontend:
    image: node:22-bookworm
    working_dir: /frontend
    volumes:
      - ./frontend:/frontend
    command: sh -c "npm install && npx vite --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      VITE_WS_URL: ws://localhost:8081
    depends_on:
      - websocket
